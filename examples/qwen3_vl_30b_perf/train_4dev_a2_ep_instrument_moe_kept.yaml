# Qwen3-VL-30B-A3B-Instruct: per-layer MoE memory and imbalance tail, with the
# MoE blocks kept out of recomputation. 4 Ascend A2 devices, FSDP + EP.
#
# Two questions this run answers, with the EP instrument on every rank:
# - How much memory each MoE block keeps for backward, per layer and per rank,
#   when it is not recomputed. activation_checkpoint.mode full_except_moe
#   recomputes the vision blocks whole and, in the text decoder, only the
#   attention and the norms; the MoE block of every text layer keeps its
#   activations, so the analysis's "memory per MoE block" section reads them.
# - How far the per-layer imbalance goes over many steps: 60 steps instead of
#   10, so the capacity sweep sees more than a handful of layers per rank.
#
# Depth: without MoE recompute each text layer holds roughly 1.5-2 GiB more on
# an average rank, and more on the busiest one. The full-recompute run peaked
# at 43 GiB with 12 layers; 6 layers drop about 7 GiB of weights, gradients and
# moments and add roughly 10 GiB of MoE activations. If that still runs out of
# memory, --model.num_hidden_layers=4 leaves about 7 GiB more room.
#
# Fragmentation: the MoE buffers change size every step with the routing, and
# the first 6-layer run failed at step 21 asking for the 9.28 GiB fp32 logits
# gradient with 42.5 GiB allocated, 53.5 GiB reserved and only 6 GiB left on the
# die: 11 GiB were cached but no free block was large enough. Growing segments
# in place avoids that; set it before launching:
#   export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
#
# Weights: the learning rate is 0. Every step still computes gradients and runs
# the optimizer, so time and memory are those of training, but the router keeps
# its pretrained weights: routing then depends on the data alone, instead of
# drifting as the model fits the batches (the loss fell from 7.4 to 6.3 in six
# steps on the synthetic data, and the imbalance grew with it).
#
# Data: real image-text conversations from four subsets of the_cauldron (0.8 GB
# download), joined into 16384-token samples by prepare_cauldron_data.py.
#
# Run from the repository root. Build the dataset once (240 samples, 60 steps at
# 4 ranks, so the DataLoader does not restart during the run):
#   python examples/qwen3_vl_30b_perf/prepare_cauldron_data.py \
#     --output-dir /home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/data/cauldron_seq16384_n240 \
#     --seq-len 16384 --num-samples 240 \
#     --processor-path /home/pl/Qwen3-VL-30B-A3B-Instruct
#   torchrun --nproc_per_node=4 --master_port=29500 \
#     scripts/train_vl.py examples/qwen3_vl_30b_perf/train_4dev_a2_ep_instrument_moe_kept.yaml
#   python examples/qwen3_vl_30b_perf/analyze_ep_instrument.py \
#     /home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/ep_instrument_cauldron --skip 2
#
# The synthetic dataset of prepare_perf_data.py still works as a comparison:
#   --dataset.data_path=/home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/data/seq16384_img4_n240/vlm_conversations.json
#   --ep_instrument.output_dir=/home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/ep_instrument_moe_kept
#
# Devices: torchrun assigns LOCAL_RANK 0..3, which bind to dies 0..3.

model:
  _target_: examples.qwen3_vl_30b_perf.cropped_qwen3_vl.build_cropped_qwen3_vl
  # One key: the checkpoint, the HF configuration that the builder crops, and
  # the processor source that the VLM Trainer reads.
  pretrained_model_name_or_path: /home/pl/Qwen3-VL-30B-A3B-Instruct
  num_hidden_layers: 6
  local_files_only: true
  torch_dtype: bfloat16
  # On Ascend, transformers routes flash_attention_2 to torch_npu's
  # npu_fusion_attention: varlen over per-image cu_seqlens in the vision tower;
  # the fused text attention below runs the causal sparse mode.
  attn_implementation: flash_attention_2
  # Under EP the sharding planner covers the text decoder but, in the vision
  # tower, only the LayerNorms, and its coverage check fails. This keeps the
  # undeclared vision parameters as plain FSDP parameters (the correct layout
  # at TP = CP = 1) and turns the check into a warning.
  allow_uncovered_params: true
  validate_placement: false

training:
  train_iters: 60
  global_batch_size: 4
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  logging_steps: 1

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 4
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 4
  edp_shard_size: 1
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

# Module replacements run before sharding and checkpoint loading.
# module_type + exact_type keep the vision tower untouched. Replacement targets
# must not nest, so the per-head q/k norms inside self_attn stay Transformers
# RMSNorm modules.
plan_overrides:
  # torch_npu.npu_rms_norm for the decoder-layer and final text norms.
  - match:
      - "*.language_model.layers.*.input_layernorm"
      - "*.language_model.layers.*.post_attention_layernorm"
      - "*.language_model.norm"
    module_type: transformers.models.qwen3_vl_moe.modeling_qwen3_vl_moe.Qwen3VLMoeTextRMSNorm
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.RMSNorm
  # modules.GQAAttention (fused QKV projection, fused RoPE) driven by the
  # Qwen3 attention interface: mask-free batches run npu_fusion_attention's
  # causal sparse mode, which skips fully masked blocks.
  - match: "*.language_model.layers.*.self_attn"
    module_type: transformers.models.qwen3_vl_moe.modeling_qwen3_vl_moe.Qwen3VLMoeTextAttention
    exact_type: true
    replace_module:
      _target_: hyper_parallel.models.qwen3_moe.adapter.replacements.replace_qwen3_moe_flash_attention
  # Grouped-GEMM routed experts (npu_moe_token_permute + npu_grouped_matmul).
  - match: "*.language_model.layers.*.mlp.experts"
    module_type: transformers.models.qwen3_vl_moe.modeling_qwen3_vl_moe.Qwen3VLMoeTextExperts
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.GroupedExperts
  # EP all-to-all dispatch/combine around the grouped experts. Scoped to the
  # text layers: the vision blocks also own "mlp" modules.
  - match: "*.language_model.layers.*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.models.qwen3_moe.adapter.distributed.expert_parallel.qwen3moe_ep_compute_fn
      use_grouped_gemm: true

mixed_precision:
  enabled: false

# Recompute the vision blocks and the text attention and norms; keep the MoE
# activations of every text layer.
activation_checkpoint:
  mode: full_except_moe

activation_swap: none

compile:
  enabled: false

dataset:
  _target_: hyper_parallel.data.vlm.build_vlm_dataset
  # Built by prepare_cauldron_data.py for this sequence length (see the header).
  data_path: /home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/data/cauldron_seq16384_n240/vlm_conversations.json
  data_config:
    source_type: online
  model_assets:
    chat_template: null
    tokenizer: null
  data_transform:
    _target_: hyper_parallel.data.vlm.build_vlm_data_transform
    max_seq_len: 16384

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.vlm.build_vlm_collator
  # get_batch omitted: VLMTrainer defaults to build_vlm_get_batch.
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  # Image preprocessing and tokenization of long samples run in worker
  # processes so they stay off the training critical path.
  num_workers: 4
  pin_memory: false
  prefetch_factor: 2

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    # 0: measure with the pretrained router (see the header).
    adamw_lr: 0.0
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: /home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/checkpoints

debug:
  check_nan_inf: false
  check_dataset: null

profiling:
  enabled: false
  rank: 0
  start_step: 6
  end_step: 8
  trace_dir: /home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/train_4dev_a2_profile/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false

# Expert-parallel imbalance recording. start_step skips the warm-up steps, whose
# allocator growth and first-touch HCCL links say nothing about the steady state;
# end_step 0 records to the end of the run.
ep_instrument:
  enabled: true
  output_dir: /home/pl/hyper-parallel/outputs/qwen3_vl_30b_perf/ep_instrument_cauldron
  start_step: 3
  end_step: 0
  # Read a peak per phase boundary, which resets the allocator's peak counters;
  # the trainer's own peak metric folds the recorder's running peak back in.
  segment_peaks: true
  # Meet the ranks at a barrier before each step, so their recorded timelines
  # start together.
  align_steps: true
  record_counts: true
