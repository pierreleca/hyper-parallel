# Qwen3-VL-30B-A3B-Instruct: MoE activation budget with the excess swapped to
# host (ep_host_swap). 4 Ascend A2 devices, FSDP + EP; same model,
# data, parallelism and determinism as train_4dev_a2_ep_instrument_moe_kept.yaml,
# so its run (ep_instrument_cauldron) is the baseline, step for step.
#
# What the swap does: the MoE layers of a forward pass may together keep
# capacity_factor times the routed pairs a rank sends, summed over the layers.
# When a rank's projected end-of-forward total goes over, whole saved tensors of
# its earliest layers go to pinned host memory on a side stream, and come back
# in backward while the layer above them runs. Below 1, every rank swaps every
# step.
#
# What to read:
# - the log line "EP host swap rankN step S": layers swapped, GiB moved,
#   the D2H and H2D bandwidths and how long the compute stream waited;
# - ep_host_swap/host_swap_rank<N>.jsonl: the same per layer;
# - the EP instrument (on, as in the baseline): the per-layer memory, the step
#   peaks and where the allocator's reserve grows, tagged with the swaps, to
#   set against the baseline's same report:
#     python examples/qwen3_vl_30b_perf/analyze_ep_instrument.py \
#       /home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron/instrument --skip 2 \
#       --swap-dir /home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron/ep_host_swap
# - the routing, which must match the baseline step by step, since the swap
#   changes no value:
#     python examples/qwen3_vl_30b_perf/analyze_ep_instrument.py \
#       /home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron/instrument \
#       --compare /home/pl/runs/qwen3_vl_30b_perf/ep_instrument_cauldron
#
# Run from the repository root:
#   export PYTORCH_NPU_ALLOC_CONF=expandable_segments:True
#   torchrun --nproc_per_node=4 --master_port=29500 \
#     scripts/train_vl.py examples/qwen3_vl_30b_perf/train_4dev_a2_ep_host_swap.yaml
# Stress variant: --ep_host_swap.capacity_factor=1.0
#   --ep_host_swap.output_dir=/home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron_c10/ep_host_swap
#   --ep_instrument.output_dir=/home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron_c10/instrument
#
# Devices: torchrun assigns LOCAL_RANK 0..3, which bind to dies 0..3.

model:
  _target_: examples.qwen3_vl_30b_perf.cropped_qwen3_vl.build_cropped_qwen3_vl
  # One key: the checkpoint, the HF configuration that the builder crops, and
  # the processor source that the VLM Trainer reads.
  pretrained_model_name_or_path: /home/pl/Qwen3-VL-30B-A3B-Instruct
  num_hidden_layers: 6
  local_files_only: true
  torch_dtype: bfloat16
  # On Ascend, transformers routes flash_attention_2 to torch_npu's
  # npu_fusion_attention: varlen over per-image cu_seqlens in the vision tower;
  # the fused text attention below runs the causal sparse mode.
  attn_implementation: flash_attention_2
  # Under EP the sharding planner covers the text decoder but, in the vision
  # tower, only the LayerNorms, and its coverage check fails. This keeps the
  # undeclared vision parameters as plain FSDP parameters (the correct layout
  # at TP = CP = 1) and turns the check into a warning.
  allow_uncovered_params: true
  validate_placement: false

training:
  train_iters: 20
  global_batch_size: 4
  micro_batch_size: 1
  backend: hccl
  init_device: meta
  loss_aggregation: token_weighted
  max_grad_norm: 1.0
  seed: 42
  # Step i gives the same result in every run (see the header).
  enable_full_determinism: true
  logging_steps: 1

accelerator:
  tp_size: 1
  cp_size: 1
  ep_size: 4
  pp_size: 1
  sequence_parallel: false
  loss_parallel: false

fsdp_config:
  dp_shard_size: 4
  edp_shard_size: 1
  replicate_params: []
  reshard_after_forward: true
  reshard_after_backward: true
  requires_grad_sync: true
  forward_prefetch_depth: 1
  backward_prefetch_depth: 1
  comm_fusion: false

# Module replacements run before sharding and checkpoint loading.
# module_type + exact_type keep the vision tower untouched. Replacement targets
# must not nest, so the per-head q/k norms inside self_attn stay Transformers
# RMSNorm modules.
plan_overrides:
  # torch_npu.npu_rms_norm for the decoder-layer and final text norms.
  - match:
      - "*.language_model.layers.*.input_layernorm"
      - "*.language_model.layers.*.post_attention_layernorm"
      - "*.language_model.norm"
    module_type: transformers.models.qwen3_vl_moe.modeling_qwen3_vl_moe.Qwen3VLMoeTextRMSNorm
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.RMSNorm
  # modules.GQAAttention (fused QKV projection, fused RoPE) driven by the
  # Qwen3 attention interface: mask-free batches run npu_fusion_attention's
  # causal sparse mode, which skips fully masked blocks.
  - match: "*.language_model.layers.*.self_attn"
    module_type: transformers.models.qwen3_vl_moe.modeling_qwen3_vl_moe.Qwen3VLMoeTextAttention
    exact_type: true
    replace_module:
      _target_: hyper_parallel.models.qwen3_moe.adapter.replacements.replace_qwen3_moe_flash_attention
  # Grouped-GEMM routed experts (npu_moe_token_permute + npu_grouped_matmul).
  - match: "*.language_model.layers.*.mlp.experts"
    module_type: transformers.models.qwen3_vl_moe.modeling_qwen3_vl_moe.Qwen3VLMoeTextExperts
    exact_type: true
    replace_module:
      _target_: hyper_parallel.components.modules.GroupedExperts
  # EP all-to-all dispatch/combine around the grouped experts. Scoped to the
  # text layers: the vision blocks also own "mlp" modules.
  - match: "*.language_model.layers.*.mlp"
    when: ep
    region_dispatch: false
    local_compute_fn:
      _target_: hyper_parallel.models.qwen3_moe.adapter.distributed.expert_parallel.qwen3moe_ep_compute_fn
      use_grouped_gemm: true

mixed_precision:
  enabled: false

# Recompute the vision blocks and the text attention and norms; keep the MoE
# activations of every text layer.
activation_checkpoint:
  mode: full_except_moe

activation_swap: none

compile:
  enabled: false

dataset:
  _target_: hyper_parallel.data.vlm.build_vlm_dataset
  # Built by prepare_cauldron_data.py for this sequence length (see the header).
  data_path: /home/pl/data/qwen3_vl_30b_perf/cauldron_seq16384_n240/vlm_conversations.json
  data_config:
    source_type: online
  model_assets:
    chat_template: null
    tokenizer: null
  data_transform:
    _target_: hyper_parallel.data.vlm.build_vlm_data_transform
    max_seq_len: 16384

dataloader:
  _target_: hyper_parallel.data.batching.FixedBatchDataLoader
  collate_fn:
    _target_: hyper_parallel.data.vlm.build_vlm_collator
  # get_batch omitted: VLMTrainer defaults to build_vlm_get_batch.
  dataloader_type: single
  data_rearrange_map: null
  data_sharding: false
  drop_last: true
  use_background_prefetcher: false
  # Image preprocessing and tokenization of long samples run in worker
  # processes so they stay off the training critical path.
  num_workers: 4
  pin_memory: false
  prefetch_factor: 2

optimizer:
  _target_: hyper_parallel.components.optim.AdamW
  no_decay_params: [bias, norm, ln_]
  adamw_config:
    adamw_lr: 1.0e-5
    adamw_weight_decay: 0.01
    adamw_betas: [0.9, 0.999]
    adamw_eps: 1.0e-8

lr_scheduler:
  _target_: hyper_parallel.components.optim.MultiLRScheduler
  lr_decay_style: cosine
  lr_config:
    lr_warmup_steps: 1
    min_lr: 0.0

checkpoint:
  save_ckpt: false
  checkpoint_dir: /home/pl/runs/qwen3_vl_30b_perf/checkpoints

debug:
  check_nan_inf: false
  check_dataset: null

profiling:
  enabled: false
  rank: 0
  start_step: 6
  end_step: 8
  trace_dir: /home/pl/runs/qwen3_vl_30b_perf/train_4dev_a2_profile/profiling
  record_shapes: false
  profile_memory: false
  with_stack: false
  with_modules: false

# Expert-parallel imbalance recording. start_step skips the warm-up steps, whose
# allocator growth and first-touch HCCL links say nothing about the steady state;
# end_step 0 records to the end of the run.
ep_instrument:
  enabled: true
  output_dir: /home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron/instrument
  start_step: 3
  end_step: 0
  # Read a peak per phase boundary, which resets the allocator's peak counters;
  # the trainer's own peak metric folds the recorder's running peak back in.
  segment_peaks: true
  # Meet the ranks at a barrier before each step, so their recorded timelines
  # start together.
  align_steps: true
  record_counts: true

# MoE host swap: bound the MoE activations of a pass, the excess goes to pinned host memory.
ep_host_swap:
  enabled: true
  # Mean layers of MoE activations a rank may keep over the pass (a mean layer:
  # one layer at the rank's own sent pairs); the rest goes to host, earliest
  # layers first. 5.4 of 6 layers is 0.9 per layer; 1.0 to 0.3 per layer was
  # the useful range on 16 A3 dies.
  budget_layers: 5.4
  # Index tensors (8 bytes per pair) stay on device.
  min_row_bytes: 1024
  output_dir: /home/pl/runs/qwen3_vl_30b_perf/ep_host_swap_cauldron/ep_host_swap
